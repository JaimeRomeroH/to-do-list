<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Control de tareas</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <!-- Jquery CDN -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.js" integrity="sha512-n/4gHW3atM3QqRcbCn6ewmpxcLAHGaDjpEBu4xZd47N0W2oQ+6q7oc3PXstrJYXcbNU1OHdQ1T7pAP+gi5Yu8g==" crossorigin="anonymous"></script>

    </head>

    <body>
        
        <h1>Agregar tarea</h1>

        <form action="" method="post">
            <input type="text" name="tarea" id="tarea">
            <br>
            <button type="button" id="btnEnviar">Agregar tarea</button>
        </form>
        
        <ul>
            <li>
                Hacer una aplicación con JQuery 
                <input type="button" value="x"> <input type="button" value="&#10003">
            </li>
            <li>
                Hacer una aplicación con PHP <input type="button" value="x"> 
                <input type="button" value="&#10003">
            </li>
            <li>
                Hacer una aplicación con JavaScript 
                <input type="button" value="x"> <input type="button" value="&#10003">
            </li>
        </ul>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

        <script>
            
            $(document).ready(function(){

                cargarTareas();

                $("#btnEnviar").click(function (e) {

                    var objTarea = $("#tarea").val();

                    $.ajax({
                        type: "POST",
                        url: "api.php",
                        data: {accion: "agregar", tarea: objTarea},
                        dataType: "text",
                        success: function (resultado) {
                            alert(resultado);
                            console.log(resultado);
                            $("#txtMensaje").html(resultado);
                        }
                    });
                
                });

                function cargarTareas(){
                    $.ajax({
                        type: "POST",
                        url: "api.php",
                        data: {accion: "leer"},
                        dataType: "text",
                        success: function (resultado) {
                            alert(resultado);
                            console.log(resultado);                            
                        }
                    });
                }
            });
            
        </script>
    </body>
</html>
